name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate route pages and sitemap
        run: node scripts/build-routes.js
        env:
          BUILD_VERSION: ${{ github.sha }}

      # The CLO 3D viewer files stay in the repo, but the site doesn't load them.
      - name: Leave unused 3D viewer files out of the published site
        run: find website/images/products -type f \( -name 'bundle.*' -o -name '*.html' \) -delete

      - name: Package the website folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
