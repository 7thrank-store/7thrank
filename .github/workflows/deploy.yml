name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate route pages and sitemap
        run: node scripts/build-routes.js

      # The CLO 3D viewer files stay in the repo, but the site doesn't load them.
      - name: Leave unused 3D viewer files out of the published site
        run: find website/images/products -type f \( -name 'bundle.*' -o -name '*.html' \) -delete

      - name: Deploy website folder to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website
          publish_branch: gh-pages
